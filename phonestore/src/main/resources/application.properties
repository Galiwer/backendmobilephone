# Profile configuration - activate production profile on Railway
spring.profiles.active=${RAILWAY_ENVIRONMENT:dev}

# Common configurations
spring.application.name=phonestore

# Development-only configurations (will be overridden by application-prod.properties in production)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/phonestore
spring.datasource.username=root
spring.datasource.password=

# Development logging
logging.level.com.ciro.phonestore=DEBUG
logging.level.org.springframework.security=INFO

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${user.home}/phonestore/firmware-uploads

# Development JPA settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Development CORS settings
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Enable HTTP methods like PUT and DELETE from forms
spring.mvc.hiddenmethod.filter.enabled=true

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.main.allow-bean-definition-overriding=true

# Server Configuration
server.tomcat.threads.max=4
server.tomcat.max-connections=20
server.tomcat.accept-count=10
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB

# Spring Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Garbage Collection Optimization
spring.jvm.gc.type=G1
spring.jvm.gc.max-gc-pause-millis=200

# Memory Management
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Caching Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m

# Logging Configuration
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.ciro.phonestore=INFO
